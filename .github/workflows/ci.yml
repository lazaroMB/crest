# crest CI: `make ci` (doctor + check) on Linux and macOS, and clippy plus
# the tests on Windows.
#
# Actions pinned by commit SHA (with the version in the comment): a tag can
# move, a SHA cannot. Dependabot or Renovate can update them.
#
# macOS: the macos-15 image ships with the full Xcode selected, so
# install-deps.sh finds the Command Line Tools and the Metal compiler without
# installing anything from the App Store. GPUI is built with `runtime_shaders`,
# so the build does not invoke Metal; only `make doctor` checks it. If a future
# image ships Xcode 26+ without the Metal toolchain, the "Metal toolchain" step
# downloads it.
#
# The GPUI tests use the TestAppContext from `test-support`, which opens no
# windows: no display (or xvfb-run) is needed on Linux.
#
# Windows runs cargo directly: `make ci` and its doctor, architecture and
# install checks are bash scripts, already covered by the Unix jobs. rg and
# fzf come from Chocolatey (preinstalled on the image); git is there too.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info: a much smaller target/ (GPUI is big) and a lighter cache.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  ci:
    name: make ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before install-deps: also restores ~/.cargo/bin (cache-bin), so
      # cargo-insta and cargo-nextest are not rebuilt on every run.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "true"

      - name: Metal toolchain
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          if ! xcrun -sdk macosx metal --version </dev/null; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Install dependencies
        run: |
          bash scripts/install-deps.sh --yes --dev
          # rg and fzf may end up in ~/.local/bin if the package is too old.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # If the runner had no Rust, rustup puts it in ~/.cargo/bin.
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: make ci
        run: make ci

  windows:
    name: clippy and tests (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install rg and fzf
        run: choco install ripgrep fzf --no-progress --yes

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests
        # Every failing test binary at once, not just the first.
        run: cargo test --workspace --locked --no-fail-fast

  install-deps-containers:
    name: install-deps --check (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:22.04", "fedora:latest", "archlinux:latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # On a clean image --check must exit 1, list what is missing and not
      # hang; the script checks it with docker (preinstalled on the runner).
      - name: install-deps.sh --check on ${{ matrix.image }}
        run: bash tests/install-deps/run-containers.sh "${{ matrix.image }}"
