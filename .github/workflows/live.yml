# Tests against the real Anthropic API. Manual only (workflow_dispatch): it
# does not run on push or pull_request. Needs the repository secret
# ANTHROPIC_API_KEY; the key only arrives through an environment variable.

name: Live API tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  live:
    name: make test-live
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install dependencies
        run: |
          bash scripts/install-deps.sh --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # If the runner had no Rust, rustup puts it in ~/.cargo/bin.
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: make test-live
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: make test-live
