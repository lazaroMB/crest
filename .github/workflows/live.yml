# Tests contra la API real de Anthropic. Solo manual (workflow_dispatch): no
# corre en push ni en pull_request. Necesita el secreto ANTHROPIC_API_KEY del
# repositorio; la clave solo llega por variable de entorno.

name: Live API tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  live:
    name: make test-live
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Instalar dependencias
        run: |
          bash scripts/install-deps.sh --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: make test-live
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: make test-live
