# crest release: tarballs for Linux and macOS, a zip for Windows.
#
# On a v* tag it builds, packages and publishes a GitHub Release with the
# tarballs and their checksums, then updates the Homebrew tap and winget
# (not for prereleases). On workflow_dispatch it only leaves the artifacts
# on the run (no release), handy to test the pipeline.
#
# Signing and publishing need repository secrets; each step that uses one
# is skipped while it is missing, so the pipeline works without them:
# - APPLE_CERT_P12_BASE64, APPLE_CERT_PASSWORD, APPLE_API_KEY_JSON: sign
#   and notarize crest.app (scripts/sign-macos.sh).
# - SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID: sign crest.exe with
#   SignPath Foundation (release-signing on tags, test-signing otherwise).
# - PACKAGES_TOKEN: a classic token with public_repo, to push the cask to
#   lazaroMB/homebrew-tap and open winget-pkgs pull requests.
#
# Same conventions as ci.yml: actions pinned by commit SHA (with the version
# in the comment), rust-cache and scripts/install-deps.sh.
#
# Linux builds on ubuntu-22.04, not 24.04: the binary links the runner's
# glibc, and 22.04's 2.35 covers more distros (Ubuntu 22.04+, Debian 12+,
# Fedora 36+, RHEL 9 and derivatives) than 24.04's 2.39. install-deps.sh
# already supports 22.04 (it downloads the official rg and fzf because the
# distro ones are too old). When GitHub retires that image, move to the next
# LTS and update the minimum glibc in scripts/package.sh. aarch64 builds
# natively on ubuntu-22.04-arm (same glibc).
#
# macOS: both binaries come from macos-15 (arm64); x86_64 is cross-compiled
# with `rustup target add`. crest.app is signed with a Developer ID,
# notarized and stapled inside scripts/package.sh --sign.
#
# Windows: built on windows-2025 with MSVC; the release build compiles
# GPUI's HLSL shaders with fxc.exe from the Windows SDK of the image.
# crest.exe goes to SignPath as an artifact and comes back signed before
# scripts/package.ps1 makes the zip and the Inno Setup installer (Inno
# Setup 6 comes with the image); the installer is signed the same way.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Minimum macOS for the binary (Rust's for aarch64; raises x86_64's).
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    permissions:
      contents: read
      # SignPath reads the unsigned artifact and the run to check its origin.
      actions: read
    env:
      SIGN_MACOS: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
      SIGN_WINDOWS: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    defaults:
      run:
        # Git Bash on Windows, so the version step is the same everywhere.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      # Same as in ci.yml: install-deps.sh checks the Metal compiler on macOS
      # even though the build (runtime_shaders) does not use it.
      - name: Metal toolchain
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          if ! xcrun -sdk macosx metal --version </dev/null; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Install dependencies
        if: runner.os != 'Windows'
        run: |
          bash scripts/install-deps.sh --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Rust target
        run: rustup target add "${{ matrix.target }}"

      # A v1.2.3 tag must match the workspace version.
      - name: Version
        id: version
        run: |
          pkgid="$(cargo pkgid -p crest)"
          version="${pkgid##*[#@]}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: cargo build --release
        run: cargo build --release --locked --target "${{ matrix.target }}" -p crest

      - name: Upload the unsigned crest.exe
        id: unsigned
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/crest.exe
          if-no-files-found: error

      - name: Sign crest.exe (SignPath)
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: crest
          signing-policy-slug: ${{ github.ref_type == 'tag' && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # The signed binary replaces the built one, so package.ps1 zips it.
      - name: Check the signature (Windows)
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $signed = "signed/crest.exe"
          $sig = Get-AuthenticodeSignature $signed
          Write-Output "$($sig.Status) $($sig.SignerCertificate.Subject)"
          if ('${{ github.ref_type }}' -eq 'tag' -and $sig.Status -ne 'Valid') {
            throw "crest.exe is not validly signed: $($sig.Status)"
          }
          Copy-Item -Force $signed "target/${{ matrix.target }}/release/crest.exe"

      - name: Package
        if: runner.os != 'Windows'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_JSON: ${{ secrets.APPLE_API_KEY_JSON }}
        run: |
          set --
          if [ "${{ runner.os }}" = macOS ] && [ "$SIGN_MACOS" = true ]; then
            set -- --sign
          fi
          bash scripts/package.sh --target "${{ matrix.target }}" \
            --version "${{ steps.version.outputs.version }}" --out dist "$@"

      # What a user gets: Gatekeeper must accept the app from the tarball.
      - name: Check the signature (macOS)
        if: runner.os == 'macOS' && env.SIGN_MACOS == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/check"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/check"
          app=$(find "$RUNNER_TEMP/check" -maxdepth 2 -name crest.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Target "${{ matrix.target }}" `
            -Version "${{ steps.version.outputs.version }}" -Out dist -Installer

      - name: Upload the unsigned setup
        id: unsigned-setup
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-setup-${{ matrix.target }}
          path: dist/*-setup.exe
          if-no-files-found: error

      - name: Sign the setup (SignPath)
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: crest
          signing-policy-slug: ${{ github.ref_type == 'tag' && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup

      # The signed setup replaces the built one; its checksum changes.
      - name: Use the signed setup
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          $signed = Join-Path signed-setup $setup.Name
          $sig = Get-AuthenticodeSignature $signed
          Write-Output "$($sig.Status) $($sig.SignerCertificate.Subject)"
          if ('${{ github.ref_type }}' -eq 'tag' -and $sig.Status -ne 'Valid') {
            throw "$($setup.Name) is not validly signed: $($sig.Status)"
          }
          Copy-Item -Force $signed $setup.FullName
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$($setup.FullName).sha256", "$hash  $($setup.Name)`n")

      # Both installers, against the files just built (no network): the
      # setup must leave an app (Start menu, Settings > Apps, PATH) and
      # take it all away again.
      - name: Install test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA "Programs/crest/crest.exe"
          $dir = Split-Path $exe
          $entry = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{9C1A9DD2-A2E2-4F50-BA98-5C1E587342BE}_is1"
          $shortcut = Join-Path ([Environment]::GetFolderPath("Programs")) "crest.lnk"
          function User-Path { "$([Environment]::GetEnvironmentVariable('Path', 'User'))".Split(";") }

          $setup = Get-ChildItem dist/*-setup.exe | Select-Object -First 1 -ExpandProperty FullName
          ./scripts/install.ps1 -Setup $setup
          & $exe --version | Tee-Object -Variable shown
          if (-not ($shown -match "crest")) { throw "crest --version printed nothing" }
          if (-not (Test-Path $shortcut)) { throw "no Start menu entry $shortcut" }
          $app = Get-ItemProperty $entry
          Write-Output "$($app.DisplayName) $($app.DisplayVersion) $($app.Publisher) $($app.DisplayIcon)"
          if ($app.DisplayVersion -ne "${{ steps.version.outputs.version }}") { throw "Settings > Apps shows $($app.DisplayVersion)" }
          if (-not ((User-Path) -contains $dir)) { throw "$dir is not on the user PATH" }
          # The config seed: a commented init.lua and the themes, kept when edited.
          $config = Join-Path $env:APPDATA "crest"
          foreach ($seeded in "init.lua", "themes/tokyonight-night.lua") {
            if (-not (Test-Path (Join-Path $config $seeded))) { throw "the setup did not create $seeded in $config" }
          }
          Set-Content (Join-Path $config "init.lua") 'app.opt.theme = "nord"'
          ./scripts/install.ps1 -Setup $setup
          if ((Get-Content (Join-Path $config "init.lua")) -ne 'app.opt.theme = "nord"') { throw "the setup replaced an edited init.lua" }
          ./scripts/install.ps1 -Uninstall
          foreach ($left in $exe, $shortcut, $entry) {
            if (Test-Path $left) { throw "uninstall left $left" }
          }
          if ((User-Path) -contains $dir) { throw "uninstall left $dir on the PATH" }
          if (-not (Test-Path (Join-Path $config "init.lua"))) { throw "uninstall removed the config" }

          Remove-Item -Recurse -Force $config
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1 -ExpandProperty FullName
          ./scripts/install.ps1 -Zip $zip
          & $exe --version | Out-Null
          if (-not (Test-Path (Join-Path $config "themes/nord.lua"))) { throw "install.ps1 -Zip did not copy the themes" }
          ./scripts/install.ps1 -Uninstall
          if (Test-Path $exe) { throw "uninstall left $exe" }

      - name: Checksum
        if: runner.os != 'Windows'
        working-directory: dist
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c ./*.sha256
          else
            shasum -a 256 -c ./*.sha256
          fi
          tar -tzvf ./*.tar.gz

      - name: Checksum (Windows)
        if: runner.os == 'Windows'
        working-directory: dist
        run: |
          sha256sum -c ./*.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crest-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: crest-*
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          cat ./*.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS

      # A tag with a hyphen (v0.2.0-rc.1) is published as a prerelease.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set --
          case "$GITHUB_REF_NAME" in *-*) set -- --prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "crest $GITHUB_REF_NAME" \
            --generate-notes --verify-tag "$@"

  # brew install --cask lazaromb/tap/crest
  homebrew:
    name: Homebrew tap
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: crest-*-apple-darwin
          path: dist
          merge-multiple: true

      - name: Publish the cask
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$PACKAGES_TOKEN" ]; then
            echo "::notice::PACKAGES_TOKEN is not set; the tap is not updated"
            exit 0
          fi
          bash scripts/publish-homebrew.sh "$GITHUB_REF_NAME" dist

  # winget install LazaroMB.Crest. The first version was sent by hand
  # (packaging/winget/README.md); Komac updates it, pinned by SHA-256.
  winget:
    name: winget
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KOMAC_VERSION: "2.16.0"
      KOMAC_SHA256: 7d2707fa6210f2789a3702de49fbd150b736dbf426ee0b9bc8e098736f9fd82d
    steps:
      - name: Submit the update
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$PACKAGES_TOKEN" ]; then
            echo "::notice::PACKAGES_TOKEN is not set; winget is not updated"
            exit 0
          fi
          # komac update needs the package; until the hand-sent first
          # version is merged into winget-pkgs there is nothing to update.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $PACKAGES_TOKEN" \
            https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/l/LazaroMB/Crest)
          if [ "$status" = 404 ]; then
            echo "::notice::LazaroMB.Crest is not in winget-pkgs yet (packaging/winget/README.md); winget is not updated"
            exit 0
          fi
          archive="komac-$KOMAC_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/russellbanks/Komac/releases/download/v$KOMAC_VERSION/$archive"
          echo "$KOMAC_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" komac
          version="${GITHUB_REF_NAME#v}"
          "$RUNNER_TEMP/komac" update LazaroMB.Crest --version "$version" \
            --urls "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/crest-$version-x86_64-pc-windows-msvc-setup.exe" \
            --release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --submit --token "$PACKAGES_TOKEN"
