# crest release: tarballs for Linux and macOS.
#
# On a v* tag it builds, packages and publishes a GitHub Release with the
# tarballs and their checksums. On workflow_dispatch it only leaves the
# artifacts on the run (no release), handy to test the pipeline.
#
# Same conventions as ci.yml: actions pinned by commit SHA (with the version
# in the comment), rust-cache and scripts/install-deps.sh.
#
# Linux builds on ubuntu-22.04, not 24.04: the binary links the runner's
# glibc, and 22.04's 2.35 covers more distros (Ubuntu 22.04+, Debian 12+,
# Fedora 36+, RHEL 9 and derivatives) than 24.04's 2.39. install-deps.sh
# already supports 22.04 (it downloads the official rg and fzf because the
# distro ones are too old). When GitHub retires that image, move to the next
# LTS and update the minimum glibc in scripts/package.sh.
#
# macOS: both binaries come from macos-15 (arm64); x86_64 is cross-compiled
# with `rustup target add`. The binaries are NOT signed or notarized: that
# needs a Developer ID and repo secrets, and is out of scope. The tarball's
# README explains how to remove the Gatekeeper quarantine.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Minimum macOS for the binary (Rust's for aarch64; raises x86_64's).
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      # Same as in ci.yml: install-deps.sh checks the Metal compiler on macOS
      # even though the build (runtime_shaders) does not use it.
      - name: Metal toolchain
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          if ! xcrun -sdk macosx metal --version </dev/null; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Install dependencies
        run: |
          bash scripts/install-deps.sh --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Rust target
        run: rustup target add "${{ matrix.target }}"

      # A v1.2.3 tag must match the workspace version.
      - name: Version
        id: version
        run: |
          pkgid="$(cargo pkgid -p crest)"
          version="${pkgid##*[#@]}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: cargo build --release
        run: cargo build --release --locked --target "${{ matrix.target }}" -p crest

      - name: Package
        run: |
          bash scripts/package.sh --target "${{ matrix.target }}" \
            --version "${{ steps.version.outputs.version }}" --out dist

      - name: Checksum
        working-directory: dist
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c ./*.sha256
          else
            shasum -a 256 -c ./*.sha256
          fi
          tar -tzvf ./*.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crest-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: crest-*
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          cat ./*.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS

      # A tag with a hyphen (v0.2.0-rc.1) is published as a prerelease.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set --
          case "$GITHUB_REF_NAME" in *-*) set -- --prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "crest $GITHUB_REF_NAME" \
            --generate-notes --verify-tag "$@"
