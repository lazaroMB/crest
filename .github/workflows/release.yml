# Release de crest: tarballs para Linux y macOS.
#
# Con un tag v* compila, empaqueta y publica una GitHub Release con los
# tarballs y sus checksums. Con workflow_dispatch solo deja los artefactos
# en la ejecución (sin release), útil para probar el pipeline.
#
# Mismas convenciones que ci.yml: acciones fijadas por SHA de commit (con la
# versión en el comentario), rust-cache y scripts/install-deps.sh.
#
# Linux se compila en ubuntu-22.04 y no en 24.04: el binario enlaza la glibc
# del runner, y la 2.35 de 22.04 cubre más distros (Ubuntu 22.04+, Debian 12+,
# Fedora 36+, RHEL 9 y derivadas) que la 2.39 de 24.04. install-deps.sh ya
# soporta 22.04 (baja rg y fzf oficiales porque los de la distro son viejos).
# Cuando GitHub retire esa imagen, pasar a la LTS siguiente y actualizar la
# glibc mínima en scripts/package.sh.
#
# macOS: ambos binarios salen de macos-15 (arm64); x86_64 se compila cruzado
# con `rustup target add`. Los binarios NO van firmados ni notarizados: eso
# requiere un Developer ID y secretos del repo, y queda fuera de alcance. El
# README del tarball explica cómo quitar la cuarentena de Gatekeeper.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Mínimo de macOS del binario (el de Rust para aarch64; sube el de x86_64).
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      # Igual que en ci.yml: install-deps.sh verifica el compilador Metal en
      # macOS aunque el build (runtime_shaders) no lo use.
      - name: Metal toolchain
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          if ! xcrun -sdk macosx metal --version </dev/null; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Instalar dependencias
        run: |
          bash scripts/install-deps.sh --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Target de Rust
        run: rustup target add "${{ matrix.target }}"

      # Un tag v1.2.3 debe coincidir con la versión del workspace.
      - name: Versión
        id: version
        run: |
          pkgid="$(cargo pkgid -p crest)"
          version="${pkgid##*[#@]}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::el tag ${GITHUB_REF_NAME} no coincide con la versión ${version} de Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: cargo build --release
        run: cargo build --release --locked --target "${{ matrix.target }}" -p crest

      - name: Empaquetar
        run: |
          bash scripts/package.sh --target "${{ matrix.target }}" \
            --version "${{ steps.version.outputs.version }}" --out dist

      - name: Checksum
        working-directory: dist
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c ./*.sha256
          else
            shasum -a 256 -c ./*.sha256
          fi
          tar -tzvf ./*.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crest-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: crest-*
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          cat ./*.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS

      # Un tag con guion (v0.2.0-rc.1) se publica como prerelease.
      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set --
          case "$GITHUB_REF_NAME" in *-*) set -- --prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "crest $GITHUB_REF_NAME" \
            --generate-notes --verify-tag "$@"
