[package]
name = "crest"
description = "Composition root of crest: reads config, wires adapters and starts the UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Export the spans to Langfuse (LANGFUSE_* variables).
langfuse = ["adapter-telemetry/langfuse"]

[lib]
name = "crest"
path = "src/lib.rs"

[[bin]]
name = "crest"
path = "src/main.rs"

[dependencies]
domain.workspace = true
application.workspace = true
adapter-anthropic.workspace = true
adapter-search.workspace = true
adapter-fs.workspace = true
adapter-shell.workspace = true
adapter-store.workspace = true
adapter-lua.workspace = true
adapter-mcp.workspace = true
adapter-telemetry.workspace = true
adapter-export.workspace = true
ui.workspace = true
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
dirs.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
# `signal` for Ctrl+C in headless mode.
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
application = { workspace = true, features = ["testing"] }
gpui = { workspace = true, features = ["test-support"] }
gpui-component.workspace = true
tempfile.workspace = true
wiremock.workspace = true

[lints]
workspace = true
