[package]
name = "platform"
description = "Operating-system glue shared by the adapters, the UI and the binary: processes, directories, the console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dirs.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
tempfile.workspace = true

# The workspace lints, except that `unsafe` is denied instead of forbidden:
# `console` needs two Win32 calls and allows it in that module alone.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
