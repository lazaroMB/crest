[package]
name = "ui"
description = "GPUI views, blocks and modal input for crest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anstyle-parse.workspace = true
application.workspace = true
async-trait.workspace = true
base64.workspace = true
bytemuck.workspace = true
chrono.workspace = true
domain.workspace = true
futures.workspace = true
gpui.workspace = true
gpui-base.workspace = true
gpui_platform.workspace = true
# Decodes pasted images to check their size and turns the formats the
# model does not take (bmp, tiff, ico, pnm) into png.
image = { workspace = true, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tiff", "webp"] }
# Tree-sitter highlighting for code blocks in markdown and the markdown
# source view; only the grammars an agent session commonly shows.
gpui-component = { workspace = true, features = [
    "tree-sitter-bash",
    "tree-sitter-javascript",
    "tree-sitter-lua",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
notify.workspace = true
# TeX math in markdown: parse, lay out, rasterize (blocks/math.rs).
ratex-layout.workspace = true
ratex-parser.workspace = true
ratex-render.workspace = true
ratex-types.workspace = true
# SVG images: parsed and rasterized off the UI thread (blocks/svg.rs).
resvg.workspace = true
rusty-mermaid.workspace = true
rusty-mermaid-core.workspace = true
serde_json.workspace = true
thiserror.workspace = true
usvg.workspace = true
uuid.workspace = true
wgpu.workspace = true

[dev-dependencies]
application = { workspace = true, features = ["testing"] }
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
