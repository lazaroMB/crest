[package]
name = "ui"
description = "GPUI views, blocks and modal input for crest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
application.workspace = true
async-trait.workspace = true
base64.workspace = true
domain.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
# Tree-sitter highlighting for code blocks in markdown and the markdown
# source view; only the grammars an agent session commonly shows.
gpui-component = { workspace = true, features = [
    "tree-sitter-bash",
    "tree-sitter-javascript",
    "tree-sitter-lua",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
notify.workspace = true
rusty-mermaid.workspace = true
rusty-mermaid-core.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
application = { workspace = true, features = ["testing"] }
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
