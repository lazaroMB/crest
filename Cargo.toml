[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/app",
    "crates/adapters/anthropic",
    "crates/adapters/search",
    "crates/adapters/fs",
    "crates/adapters/shell",
    "crates/adapters/store",
    "crates/adapters/lua",
    "crates/adapters/mcp",
    "crates/adapters/telemetry",
    "crates/ui",
    "crates/bin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates
domain = { path = "crates/domain" }
application = { path = "crates/app" }
adapter-anthropic = { path = "crates/adapters/anthropic" }
adapter-search = { path = "crates/adapters/search" }
adapter-fs = { path = "crates/adapters/fs" }
adapter-shell = { path = "crates/adapters/shell" }
adapter-store = { path = "crates/adapters/store" }
adapter-lua = { path = "crates/adapters/lua" }
adapter-mcp = { path = "crates/adapters/mcp" }
adapter-telemetry = { path = "crates/adapters/telemetry" }
ui = { path = "crates/ui" }

# Shared external crates
anyhow = "1.0.104"
async-trait = "0.1.92"
futures = "0.3.34"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

# Adapter crates (wave 2). Workers may adjust features of the line they use.
base64 = "0.23.1"
dirs = "7.0.0"
eventsource-stream = "0.2.3"
ignore = "0.4.33"
keyring = "4.2.0"
mlua = { version = "0.12.2", features = ["lua54", "vendored", "async", "serialize", "send"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
similar = "3.2.0"
tokio-util = "0.7.20"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# Test-only crates
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3.27.0"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
