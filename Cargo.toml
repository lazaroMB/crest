[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/app",
    "crates/adapters/anthropic",
    "crates/adapters/openai",
    "crates/adapters/cloudflare",
    "crates/adapters/search",
    "crates/adapters/fs",
    "crates/adapters/shell",
    "crates/adapters/web",
    "crates/adapters/store",
    "crates/adapters/lua",
    "crates/adapters/mcp",
    "crates/adapters/telemetry",
    "crates/adapters/export",
    "crates/adapters/compute",
    "crates/adapters/formats",
    "crates/platform",
    "crates/ui",
    "crates/bin",
]

[workspace.package]
version = "0.14.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Internal crates
domain = { path = "crates/domain" }
application = { path = "crates/app" }
adapter-anthropic = { path = "crates/adapters/anthropic" }
adapter-openai = { path = "crates/adapters/openai" }
adapter-cloudflare = { path = "crates/adapters/cloudflare" }
adapter-search = { path = "crates/adapters/search" }
adapter-fs = { path = "crates/adapters/fs" }
adapter-shell = { path = "crates/adapters/shell" }
adapter-web = { path = "crates/adapters/web" }
adapter-store = { path = "crates/adapters/store" }
adapter-lua = { path = "crates/adapters/lua" }
adapter-mcp = { path = "crates/adapters/mcp" }
adapter-telemetry = { path = "crates/adapters/telemetry" }
adapter-export = { path = "crates/adapters/export" }
adapter-compute = { path = "crates/adapters/compute" }
adapter-formats = { path = "crates/adapters/formats" }
ui = { path = "crates/ui" }
platform = { path = "crates/platform" }

# Shared external crates
anyhow = "1.0.104"
async-trait = "0.1.92"
futures = "0.3.34"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

# Adapter crates (wave 2). Workers may adjust features of the line they use.
base64 = "0.23.1"
dirs = "7.0.0"
# Canonical paths without Windows' verbatim `\\?\` prefix.
dunce = "1.0.5"
eventsource-stream = "0.2.3"
# Investigative and implementation flow engine. No `postgres` feature: it would pull sqlx.
graph-flow = { version = "0.8.0", default-features = false }
# HTML pages to text (adapter-web).
html2text = "0.17.4"
ignore = "0.4.33"
keyring = "4.2.0"
mlua = { version = "0.12.2", features = ["lua54", "vendored", "async", "serialize", "send"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "stream"] }
# MCP client (adapter-mcp). Tests and the example server add the
# server-side features in adapter-mcp's dev-dependencies.
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
similar = "3.2.0"
# 3D models opened with `/open` (application). PLY is parsed in-house.
stl_io = "0.11.0"
tobj = { version = "4.0.5", default-features = false }
tokio-util = "0.7.20"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
# Langfuse export (adapter-telemetry, feature `langfuse`). opentelemetry-langfuse
# 0.7 and tracing-opentelemetry 0.34 both require the opentelemetry 0.33 family.
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime"] }
opentelemetry-langfuse = "0.7.0"
tracing-opentelemetry = { version = "0.34.0", default-features = false }

# Statistics engine (adapter-compute): distributions and special functions;
# BLAKE3 hashes of the input data in the Computed envelope.
statrs = { version = "0.19.1", default-features = false }
blake3 = "1.8.7"
numbat = { version = "=1.24.0", default-features = false }
# Seeded resampling and simulation (bootstrap, Monte Carlo, simulated
# p-values): ChaCha20, the same stream on every platform.
rand_chacha = { version = "0.10.0", default-features = false }
# Forecasts: MSTL decomposition with an AutoETS trend (augurs, MIT OR
# Apache-2.0; pulls nalgebra, stlrs and rand 0.8, all permissive).
augurs-core = "=0.10.2"
augurs-ets = { version = "=0.10.2", features = ["mstl"] }
augurs-mstl = "=0.10.2"
# LP/MILP (Apache-2.0, pure Rust; sprs underneath). Used directly: good_lp
# would add a modelling layer but no duals for this solver.
microlp = { version = "=0.6.0", default-features = false }
# Money: cash flows in decimal arithmetic (MIT).
rust_decimal = { version = "=1.43.0", default-features = false, features = ["std"] }

# Report formats (adapter-formats). JUnit is read with quick-xml directly:
# quick-junit 0.8.0's deserializer is experimental and needs a
# <testsuites> root. WaveDrom without its default features: no embedded
# Helvetica (text widths come from its ASCII table) and no json5/pest
# (adapter-formats relaxes JSON5-style input itself).
quick-xml = "=0.41.0"
wavedrom = { version = "=0.1.0", default-features = false, features = ["serde_json"] }
# Dataset previews: Parquet through its record API (no arrow) with the
# codecs pandas/pyarrow and polars write by default (snappy, zstd, gzip,
# lz4); no async, no object store, no encryption.
bytes = "1.12.1"
parquet = { version = "=60.0.0", default-features = false, features = ["snap", "zstd", "flate2-zlib-rs", "lz4"] }
# pprof profiles (show_flamegraph): our own message structs on prost's
# derive (no prost-build, no generated code) and gzip through flate2,
# both already in the tree (opentelemetry-otlp, parquet).
prost = { version = "=0.14.4", default-features = false, features = ["derive", "std"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
# Molecules: SMILES parsing, formula/mass, descriptors, SVG depiction and
# reaction SMILES (pure Rust, MIT OR Apache-2.0).
chematic = { version = "=1.2.1", default-features = false, features = ["smiles", "depict", "chem", "rxn", "threed", "mol"] }
# ER diagrams from SQL DDL (show_er): Apache-2.0, std only. Without
# `recursive-protection` (stacker's C build); the parser's own depth limit
# still bounds nesting.
sqlparser = { version = "=0.63.0", default-features = false, features = ["std"] }
# Digital waveforms (show_waveform): VCD, FST and GHW readers, BSD-3-Clause
# (Surfer's backend). Pulls fst-reader (BSD-3), lz4_flex (MIT), leb128,
# num_enum, memmap2, miniz_oxide, rayon, smallvec: all MIT/Apache/BSD.
wellen = { version = "=0.25.7", default-features = false }
# STEP parts (show_step, /open): truck's STEP reader and tessellator,
# Apache-2.0 (with ruststep, spade, robust, cgmath: MIT/Apache). Without
# meshalgo's default `vtk` feature, which pulls vtkio, nom 3 and xz2's C
# build. Both stale since 2024: spiked on real AP203/AP214 files first (see
# the research note); the adapter catches their panics.
ruststep = "=0.4.0"
truck-stepio = "=0.3.0"
truck-meshalgo = { version = "=0.4.0", default-features = false, features = ["tessellation", "analyzers"] }
# 2D drawings (show_dxf): ixmilia's DXF reader, MIT. encoding_rs (MIT or
# Apache-2.0, already pulled by dxf) picks its UTF-8 reading path.
dxf = "=0.6.2"
encoding_rs = "=0.8.42"
# IFC schedules (show_ifc_schedule): IFClite's STEP/IFC scanner and decoder,
# MPL-2.0 (file-level copyleft; used unmodified).
ifc-lite-core = "=22.6.0"
# Sequences (show_sequence): GenBank flat files, MIT; adds only
# `circular` (MIT) next to nom 8 and itertools 0.14, already in the tree.
gb-io = { version = "=0.9.0", default-features = false }
mzdata = { version = "=0.67.4", default-features = false, features = ["mgf", "mzml", "zlib-rs"] }
# Maps (show_map): GeoJSON reader (MIT/Apache, without its geo-types
# conversions), georust's geodesic area and length (MIT/Apache; pulls
# geo-types, geographiclib-rs, i_overlay, rstar, robust: MIT/Apache) and a
# pure-Rust PROJ.4 port for reprojection (MIT/Apache, no WKT, no EPSG
# database: crest bundles the definitions it knows).
geojson = { version = "=1.0.0", default-features = false }
geo = { version = "=0.33.1", default-features = false }
proj4rs = { version = "=0.2.1", default-features = false }

# UI (GPUI is pre-1.0: exact versions, bump only between phases).
# gpui-component 0.7.3 on crates.io pins GPUI's published snapshot
# `gpui-pre =0.3.9` (zed@93d7456); the platform backend is a separate crate
# of the same family and must move with it.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = "=0.7.3"
# gpui-component's editing engine; the prompt projects its own editor style
# (no thin caret) through it. Same version gpui-component resolves.
gpui-base = "=0.7.3"
clap = { version = "4.6.7", features = ["derive"] }
# File watching for the workspace tree panel (9.x is still a release candidate).
notify = "8.2.0"
# Mermaid: parse and lay out to a backend-agnostic Scene that the UI paints
# itself. 0.2.0 publishes no `gpui` feature; `-core` names the primitives.
rusty-mermaid = { version = "=0.2.0", default-features = false }
rusty-mermaid-core = "=0.2.0"
# Offscreen 3D board of the simulator (DirectX 12 on Windows). Same major
# version as the wgpu GPUI links on Linux (gpui-pre-wgpu 0.3.9), so it is not
# built twice there.
wgpu = { version = "29.0.4", default-features = false, features = ["std", "wgsl", "vulkan", "gles", "metal", "dx12"] }
bytemuck = "1.25.2"
# LaTeX math in markdown: RaTeX's KaTeX-compatible parser (mhchem
# included), layout and rasterizer with the KaTeX fonts embedded (all MIT).
# Used directly rather than through ratex-gpui 0.4.1, which hides the parse
# error and the box depth that inline math needs for its baseline.
ratex-parser = "=0.1.15"
ratex-layout = "=0.1.15"
ratex-render = { version = "=0.1.15", features = ["embed-fonts"] }
ratex-types = "=0.1.15"
# ANSI escapes in shell output (SGR colors; the rest is dropped).
anstyle-parse = "=1.0.0"
# SVG images rasterized off the UI thread (the versions gpui-pre uses).
resvg = { version = "=0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
usvg = { version = "=0.46.0", default-features = false }
# Frames of GPUI's RenderImage (the version gpui-pre uses).
image = { version = "0.25.10", default-features = false }

# Icon and version of crest.exe (crates/bin build script, Windows targets).
embed-resource = "3.0.12"
# Windows console of the GUI binary (crates/platform only).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

# Test-only crates
# hyper serves adapter-mcp's example server over streamable HTTP.
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3.27.0"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Release binary (`make release`, release.yml). Thin LTO and stripped symbols
# shrink the binary without the build time of fat LTO or codegen-units = 1.
# Debug and test profiles are untouched.
[profile.release]
lto = "thin"
strip = "symbols"
