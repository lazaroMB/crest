[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates
domain = { path = "crates/domain" }
application = { path = "crates/app" }

# Shared external crates
anyhow = "1.0.104"
async-trait = "0.1.92"
futures = "0.3.34"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

# Test-only crates
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3.27.0"
